<!doctype html>
<html lang="es" data-theme="dark">
<head>
<!-- Página propia del proyecto (punto de partida: prototipo v3.2). Se edita aquí. -->
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diálisis Peritoneal · UNO-P</title>
<meta name="dp-version" content="1.1 · 25-oct-2026 · Modo claro/oscuro, farmacia simplificada, indicadores gráficos con filtro por EPS · Módulo de Diálisis Peritoneal (SOGCS-habilitación, contratación, gestión clínica, farmacia, eventos, indicadores, nota técnica)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0a1120; --surface:#101a2c; --surface-2:#152238; --surface-3:#1b2a45; --line:#22324f; --line-2:#2c3f61;
  --ink:#e7eef7; --ink-2:#c5d2e3; --muted:#8fa2bd; --faint:#61748f;
  --accent:#22c1e3; --accent-ink:#04202a; --accent-soft:rgba(34,193,227,.12);
  --ok:#3ccf91; --warn:#f2b84b; --bad:#f2716b; --info:#8ab4ff;
  --ok-soft:rgba(60,207,145,.13); --warn-soft:rgba(242,184,75,.13); --bad-soft:rgba(242,113,107,.13); --info-soft:rgba(138,180,255,.12);
  --f-display:"IBM Plex Sans","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:8px;
  color-scheme:dark;
  --topbar:rgba(10,17,32,.92); --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:none;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f2f5f9; --surface-3:#e6ebf2; --line:#e0e6ee; --line-2:#c9d3df;
  --ink:#111c22; --ink-2:#2a3944; --muted:#55646d; --faint:#7b8893;
  --accent:#0b7285; --accent-ink:#ffffff; --accent-soft:rgba(11,114,133,.10);
  --ok:#1e7d45; --warn:#9a5d00; --bad:#c0362f; --info:#2f5fb3;
  --ok-soft:rgba(30,125,69,.10); --warn-soft:rgba(214,140,0,.13); --bad-soft:rgba(192,54,47,.09); --info-soft:rgba(47,95,179,.09);
  --topbar:rgba(255,255,255,.94); --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --shadow:0 1px 2px rgba(16,28,34,.05),0 1px 3px rgba(16,28,34,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;gap:10px;padding:4px 6px 12px;border-bottom:1px solid var(--line)}
.brand .logo{background:#fff;border-radius:8px;padding:4px 6px;display:inline-flex;align-self:flex-start}
.brand .logo img{height:34px;display:block}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{font-family:var(--f-display);font-size:17px;line-height:1.2;margin:0;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:10px 8px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink-2);cursor:pointer;font-weight:600;font-size:13.5px}
.nav button svg{width:17px;height:17px;flex:none;opacity:.85}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--surface-3);border-radius:10px;padding:0 7px;color:var(--muted)}
.nav .count.bad{background:var(--bad-soft);color:var(--bad)}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--faint);padding:8px 6px;border-top:1px solid var(--line)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--topbar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.topbar .ttl{font-family:var(--f-display);font-weight:700;font-size:15px;margin-right:auto;min-width:0}
.topbar .ttl small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.field.inline{flex-direction:row;align-items:center;gap:8px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;min-height:36px;color:var(--ink);font-weight:400;font-size:14px;max-width:100%}
textarea{min-height:64px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:7px 12px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn svg{width:15px;height:15px}
.content{padding:22px;max-width:1440px;width:100%}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.mhead h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.mhead p{margin:4px 0 0;color:var(--muted);max-width:820px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-family:var(--f-display);font-size:15.5px;margin:0 0 4px;font-weight:700}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.card.flat{background:var(--surface-2)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.base{background:var(--surface-3);color:var(--ink-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill svg{width:12px;height:12px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;z-index:1;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}
table input,table select{min-height:30px;padding:4px 7px;font-size:13px}
table input[type=number]{width:78px;text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px}
.alert.bad{border-color:rgba(242,113,107,.35);background:var(--bad-soft)}
.alert.warn{border-color:rgba(242,184,75,.35);background:var(--warn-soft)}
.alert.ok{border-color:rgba(60,207,145,.35);background:var(--ok-soft)}
.alert.info{border-color:rgba(138,180,255,.3);background:var(--info-soft)}
.alert b{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.progress{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
.progress i{display:block;height:100%}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.formgrid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.formgrid .wide{grid-column:1/-1}
details.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px}
details.box>summary{cursor:pointer;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:18px;line-height:1}
details.box[open]>summary::before{transform:rotate(90deg)}
details.box>.inner{padding:0 16px 16px}
.chk{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.chkitem{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.chkitem .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chkitem .txt{flex:1 1 380px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on-ok{background:var(--ok-soft);color:var(--ok)}
.seg button.on-bad{background:var(--bad-soft);color:var(--bad)}
.seg button.on-base{background:var(--surface-3);color:var(--ink)}
.seg button.on-warn{background:var(--warn-soft);color:var(--warn)}
.evid{display:grid;gap:8px;grid-template-columns:2fr 1fr .7fr 1.4fr 1fr;margin-top:10px}
.evid input{width:100%}
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.tip{position:fixed;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:260px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ovl{position:fixed;inset:0;background:rgba(3,8,18,.7);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;width:min(860px,100%);padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg h3{font-family:var(--f-display);margin:0 0 12px;font-size:18px}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dlg .formgrid{margin-top:4px}
span>svg{width:100%;height:100%}
/* gráficas por tema */
.chart text{fill:var(--muted)}
.g-grid{stroke:var(--line);stroke-width:1}
.g-tgt{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.t-tgt{fill:var(--ok)!important;font-weight:700}
.g-band{fill:var(--ok-soft)}
.g-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.g-area{fill:var(--accent);opacity:.12}
.g-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.g-dot.bad{fill:var(--bad)}
.t-val{fill:var(--ink)!important;font-weight:700;font-size:12px}
.t-cat{fill:var(--ink-2)!important;font-weight:700;font-size:12.5px}
.t-muted{fill:var(--faint)!important;font-size:10.5px}
.b-s1{fill:var(--s1);background:var(--s1)} .b-s2{fill:var(--s2);background:var(--s2)} .b-s3{fill:var(--s3);background:var(--s3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sw.tgt{height:0;border-top:2px dashed var(--ok);border-radius:0;width:16px}
.bullet{position:relative;height:12px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.bullet .z{position:absolute;top:0;bottom:0;display:block}
.bullet .z.bad{background:var(--bad);opacity:.22} .bullet .z.warn{background:var(--warn);opacity:.22} .bullet .z.ok{background:var(--ok);opacity:.24} .bullet .z.neu{background:var(--surface-3)}
.bullet b{position:absolute;left:0;top:3px;height:6px;border-radius:3px;background:var(--ink);display:block}
.bullet b.ok{background:var(--ok)} .bullet b.warn{background:var(--warn)} .bullet b.bad{background:var(--bad)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted)}
.blist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(160px,2fr) 3fr 64px 52px;gap:12px;align-items:center}
.brow .bullet{margin-top:0}
.brow .bl{font-size:13px}
.brow .bv{text-align:right;font-weight:700}
.filterbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center}
.chip.sm{padding:3px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.steps button{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.steps button .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-3);font-size:12px;color:var(--muted)}
.steps button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.steps button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
.pcard .btn{margin-top:2px}
.hstd{margin-bottom:12px;padding:12px 14px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow .htxt{font-size:13.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;background:var(--surface-3);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.heat td{vertical-align:middle}
.hc{display:inline-block;min-width:54px;padding:3px 6px;border-radius:6px;font-family:var(--f-mono);font-size:12px;font-weight:600}
.hc.ok{background:var(--ok-soft);color:var(--ok)} .hc.bad{background:var(--bad-soft);color:var(--bad)} .hc.nd{background:var(--surface-3);color:var(--faint)}
h3.sec{font-family:var(--f-display);font-size:16px;margin:6px 0 10px}
.empty{padding:22px 0;text-align:center;color:var(--faint);font-size:13px}
.themesw{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.themesw button{background:none;border:0;padding:5px 12px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.themesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:700px){.brow{grid-template-columns:1fr 64px}.brow .bullet{grid-column:1/-1;order:3}.brow .bn{display:none}.hrow{grid-template-columns:1fr}}
.privacy{font-size:12px;color:var(--faint);border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
.matrix td.st{text-align:center;width:120px}
.st-S{color:var(--ok)} .st-N{color:var(--bad)} .st-E{color:var(--warn)} .st-Q{color:var(--info)}
.cal td,.cal th{text-align:center;padding:6px 4px;min-width:34px}
.cal td.lbl,.cal th.lbl{text-align:left;min-width:220px}
.dot{display:inline-block;width:20px;height:20px;border-radius:6px;line-height:20px;font-size:11px;font-weight:700}
.dot.p{background:var(--surface-3);color:var(--muted)}
.dot.d{background:var(--ok-soft);color:var(--ok)}
.dot.l{background:var(--bad-soft);color:var(--bad)}
.dot.f{border:1px dashed var(--line-2);color:var(--faint)}
.ptitle{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ptitle h2{margin:0}
.spark{display:inline-block;vertical-align:middle}
.doc h4{font-family:var(--f-display);font-size:15px;margin:18px 0 6px}
.doc p,.doc li{max-width:900px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;flex-direction:column;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex-direction:row;align-items:center;padding-bottom:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap}
  .side .foot{display:none}
  .content{padding:16px}
  .topbar{padding:10px 16px;position:relative}
  .evid{grid-template-columns:1fr 1fr}
}
@media print{
  .side,.topbar,.noprint{display:none!important}

# Blueprint de Render · Sistema de gestión clínica POSMÉDICA
# Tres servicios (decisión D5): PostgreSQL, Web Service (backend) y Static Site (frontend).
# Todos en la misma región. Render no tiene región en Suramérica; la más cercana es Virginia o Ohio.
#
# Primera vez: Render → New → Blueprint → elegir el repositorio. Pedirá los valores marcados con sync: false.

databases:
  - name: posmedica-db
    region: virginia
    # Plan pago más pequeño: tiene copias de seguridad y recuperación (el gratuito no tiene y expira).
    # Para crecer: 0.5c-1g, 1c-2g… (se cambia en el panel de Render sin perder datos).
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: posmedica
    user: posmedica
    # Solo los servicios de Render pueden conectarse (sin acceso desde internet).
    ipAllowList: []

services:
  # ---------- Backend: API Node.js (Express + Prisma) ----------
  - type: web
    name: posmedica-api
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/api
    # Antes de cada despliegue: migraciones (no destructivas) y siembra idempotente.
    preDeployCommand: npm run migrate:deploy -w apps/api && npm run seed -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: posmedica-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # URL pública del Static Site, p. ej. https://posmedica-web.onrender.com (sin barra final).
      - key: ALLOWED_ORIGINS
        sync: false
      # Proxy del Static Site + balanceador de Render.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: SESSION_IDLE_MIN
        value: "30"
      - key: SESSION_MAX_HOURS
        value: "12"
      # Primer administrador (solo se usa si no hay usuarios). Debe cambiar la clave al ingresar.
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_NOMBRE
        sync: false
      - key: ADMIN_CARGO
        value: Coordinación asistencial
      - key: ADMIN_CLAVE_INICIAL
        sync: false

  # ---------- Frontend: React (Vite) como sitio estático ----------
  - type: web
    name: posmedica-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # El navegador solo habla con este dominio: /api/* se reenvía al backend. Así la cookie de sesión es
      # del mismo origen (no se necesitan cookies de terceros, que los navegadores bloquean).
      # Si el backend queda con otro nombre, cambie esta URL por la que Render le asigne.
      - type: rewrite
        source: /api/*
        destination: https://posmedica-api.onrender.com/api/*
      # Rutas de la aplicación (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /index.html
        name: Cache-Control
        value: no-cache
